[project]
name = "inatel-sync"
version = "2.0.0"
description = "Mantem o Google Agenda atualizado com o Portal Inatel, o Moodle e o Outlook."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "google-api-python-client>=2.150",
    "google-auth>=2.35",
    "google-auth-httplib2>=0.2",
    "google-auth-oauthlib>=1.2",
    "keyring>=25",
    "pywin32>=306; sys_platform == 'win32'",
    "requests>=2.32",
    "tomli-w>=1.0",
    "tzdata>=2024.1",
]

[project.scripts]
inatel-sync = "inatel_sync.cli:main"

[project.gui-scripts]
# sem janela: usado pelas tarefas do Agendador
inatel-syncw = "inatel_sync.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["inatel_sync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
